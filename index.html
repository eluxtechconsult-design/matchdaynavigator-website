<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>MatchDay Navigator – World Cup 2026</title>

  <meta
    name="description"
    content="Event‑specific matchday guidance infrastructure for major sporting events. Clear arrival, access, and policy information delivered via WhatsApp."
  />

  <link rel="stylesheet" href="/assets/style.css" />

  <style>
    .hero {
      background: linear-gradient(180deg, #f8fafc, #eef2f7);
      padding: 80px 0 70px;
      text-align: center;
    }

    .hero-logo {
      width: 180px;
      margin-bottom: 20px;
    }

    .flags {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin: 24px 0 16px;
    }

    .flags img {
      width: 150px; /* ✅ 3× larger */
      height: auto;
    }

    .hero-subtitle {
      max-width: 820px;
      margin: 20px auto 0;
      color: #475569;
      font-size: 1.2rem;
      line-height: 1.6;
    }

    .cta-row {
      margin-top: 36px;
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .cta-button {
      padding: 18px 40px;
      background: #16a34a;
      color: #ffffff;
      border-radius: 14px;
      font-weight: 700;
      text-decoration: none;
      font-size: 1.05rem;
      display: inline-block;
    }

    .cta-button:hover {
      background: #15803d;
    }
  </style>
</head>

<body>

<header class="hero">
  <div class="container">

    <img src="/assets/logo.png" alt="MatchDay Navigator" class="hero-logo" />

    <h1>MatchDay Navigator</h1>

    <div class="flags">
      <img src="/assets/flags/us.png" alt="USA" />
      <img src="/assets/flags/ca.png" alt="Canada" />
      <img src="/assets/flags/mx.png" alt="Mexico" />
    </div>

    <p class="hero-subtitle">
      Event‑specific matchday guidance infrastructure for World Cup 2026<br />
      across the USA, Canada, and Mexico.
    </p>

    <div class="cta-row">
      <a href="/worldcup-2026/" class="cta-button">
        Explore World Cup 2026 Match Map
      </a>

      <a href="/cities/" class="cta-button">
        For Cities & Venues
      </a>
    </div>

  </div>
</header>

<footer style="padding:40px 0; text-align:center; font-size:0.9rem;">
  <a href="/privacy.html">Privacy Policy</a> ·
  <a href="/terms.html">Terms of Service</a>
  <p>© MatchDay Navigator</p>
</footer>

</body>
</html>
