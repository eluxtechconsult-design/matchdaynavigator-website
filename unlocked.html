<!DOCTYPE html>
<html lang=" charset="UTF-8" /><html lang="en">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You’re Unlocked – Matchday Essentials</title>

  <!-- Global site styles -->
  <link rel="stylesheet" href="/assets/style.css" />

  <style>
    .unlocked-container {
      max-width: 640px;
      margin: 80px auto;
      padding: 0 16px;
      text-align: center;
    }

    .unlocked-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.9rem;
      margin-bottom: 8px;
    }

    p {
      margin: 6px 0;
      line-height: 1.5;
      font-size: 1rem;
    }

    .primary-cta {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 22px;
      background: #16a34a;
      color: #ffffff;
      font-weight: 800;
      font-size: 1rem;
      border-radius: 8px;
      text-decoration: none;
    }

    .primary-cta:hover {
      opacity: 0.9;
    }

    .subtle {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>

<body>
  <div class="unlocked-container">
    <div class="unlocked-icon">🎉</div>
    <h1>You’re Unlocked</h1>

    <p>
      Your matchday essentials for <strong>Lumen Field</strong> are now active.
    </p>

    <p>
      You’ll receive arrival guidance, entry rules, and kick‑off reminders
      directly on WhatsApp.
    </p>

    <p class="subtle">
      Redirecting you to WhatsApp…
    </p>
  </div>

  <script>
    /*
      Seattle pilot – deterministic WhatsApp handoff
      Bird-connected number: +1 555-827-3850
    */

    const WHATSAPP_NUMBER = "15558273850";

    const MESSAGE =
      "Hi – I’m here for matchday updates for Lumen Field.";

    const WHATSAPP_URL =
      "https://wa.me/" +
      WHATSAPP_NUMBER +
      "?text=" +
      encodeURIComponent(MESSAGE);

    // Short delay allows copy to render before redirect
    setTimeout(() => {
      window.location.href = WHATSAPP_URL;
    }, 500);
  </script>
</body>
</html>
