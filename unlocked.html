<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You’re Unlocked – Matchday Essentials</title>

  <!-- Global styles -->
  <link rel="stylesheet" href="/assets/style.css" />

  <style>
    .unlocked-container {
      max-width: 640px;
      margin: 80px auto;
      padding: 0 16px;
      text-align: center;
    }
    .unlocked-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.9rem;
      margin-bottom: 8px;
    }
    p {
      margin: 6px 0;
      line-height: 1.5;
      font-size: 1rem;
    }
    .subtle {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>

<body>

<div class="unlocked-container">
  <div class="unlocked-icon">🎉</div>
  <h1>You’re Unlocked</h1>

  <p id="stadium-copy">
    Your matchday essentials are now active.
  </p>

  <p>
    You’ll receive arrival guidance, entry rules, and kick‑off reminders
    directly on WhatsApp.
  </p>

  <p class="subtle">
    Redirecting you to WhatsApp…
  </p>
</div>

<script>
  const WHATSAPP_NUMBER = "15558273850";
  const stadiumId = new URLSearchParams(window.location.search).get("stadium");

  fetch("/data/stadiums.json")
    .then(response => response.json())
    .then(stadiums => {
      const stadium = stadiums.find(s => s.id === stadiumId);
      const stadiumName = stadium ? stadium.name : "your stadium";

      document.getElementById("stadium-copy").innerHTML =
        `Your matchday essentials for <strong>${stadiumName}</strong> are now active.`;

      const MESSAGE =
        `Hi, I would like premium matchday access for ${stadiumName}.`;

      const WHATSAPP_URL =
        "https://api.whatsapp.com/send" +
        "?phone=" + WHATSAPP_NUMBER +
        "&text=" + encodeURIComponent(MESSAGE);

      window.location.href = WHATSAPP_URL;
    });
</script>

</body>
</html>
