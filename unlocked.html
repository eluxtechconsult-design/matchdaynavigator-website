<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You’re Unlocked – Matchday Essentials</title>

  <!-- Global styles -->
  <link rel="stylesheet" href="/assets/style.css" />

  <style>
    .unlocked-container {
      max-width: 640px;
      margin: 80px auto;
      padding: 0 16px;
      text-align: center;
    }

    .unlocked-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.9rem;
      margin-bottom: 8px;
    }

    p {
      margin: 6px 0;
      line-height: 1.5;
      font-size: 1rem;
    }

    .primary-cta {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 22px;
      background: #16a34a;
      color: #ffffff;
      font-weight: 800;
      font-size: 1rem;
      border-radius: 8px;
      text-decoration: none;
    }

    .primary-cta:hover {
      opacity: 0.9;
    }

    .subtle {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>

<body>

  <div class="unlocked-container">
    <div class="unlocked-icon">🎉</div>
    <h1>You’re Unlocked</h1>

    <p id="stadium-copy">
      Your matchday essentials are now active.
    </p>

    <p>
      You’ll receive arrival guidance, entry rules, and kick‑off reminders
      directly on WhatsApp.
    </p>

    <p class="subtle">
      Redirecting you to WhatsApp…
    </p>
  </div>

  <script>
    /* ===============================
       Pilot 3 – Dynamic unlock logic
       Bird-connected WhatsApp number
       =============================== */

    const WHATSAPP_NUMBER = "15558273850";

    // Stadium display names
    const STADIUM_NAMES = {
      "lumen-field": "Lumen Field",
      "metlife": "MetLife Stadium",
      "att": "AT&T Stadium",
      "sofi": "SoFi Stadium",
      "nrg": "NRG Stadium",
      "arrowhead": "GEHA Field at Arrowhead Stadium",
      "mercedes-benz": "Mercedes‑Benz Stadium",
      "levis": "Levi’s Stadium",
      "hard-rock": "Hard Rock Stadium",
      "gillette": "Gillette Stadium",
      "lincoln": "Lincoln Financial Field",
      "bmo": "BMO Field",
      "bcplace": "BC Place",
      "azteca": "Estadio Azteca",
      "bbva": "Estadio BBVA",
      "akron": "Estadio Akron"
    };

    // Read URL params
    const params = new URLSearchParams(window.location.search);
    const stadiumId = params.get("stadium");

    const stadiumName =
      STADIUM_NAMES[stadiumId] || "your stadium";

    // Update on-page copy
    document.getElementById("stadium-copy").innerHTML =
      `Your matchday essentials for <strong>${stadiumName}</strong> are now active.`;

    // Build WhatsApp message
    const MESSAGE =
      `Hi – I’m here for matchday updates for ${stadiumName}.`;

    const WHATSAPP_URL =
      "https://api.whatsapp.com/send" +
      "?phone=" + WHATSAPP_NUMBER +
      "&text=" + encodeURIComponent(MESSAGE);

    // Short delay so copy renders before redirect
    setTimeout(() => {
      window.location.href = WHATSAPP_URL;
    }, 500);
  </script>

</body>
</html>
