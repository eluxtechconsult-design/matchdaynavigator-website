<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You’re Unlocked – Matchday Essentials</title>

  <!-- Global styles -->
  <link rel="stylesheet" href="/assets/style.css" />

  <style>
    .unlocked-container {
      max-width: 640px;
      margin: 80px auto;
      padding: 0 16px;
      text-align: center;
    }
    .unlocked-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.9rem;
      margin-bottom: 8px;
    }
    p {
      margin: 6px 0;
      line-height: 1.5;
      font-size: 1rem;
    }
    .primary-cta {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 22px;
      background: #16a34a;
      color: #ffffff;
      font-weight: 800;
      font-size: 1rem;
      border-radius: 8px;
      text-decoration: none;
    }
    .primary-cta:hover {
      opacity: 0.9;
    }
    .subtle {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>

<body>
  <div class="unlocked-container">
    <div class="unlocked-icon">🎉</div>
    <h1>You’re Unlocked</h1>

    <p id="stadium-copy">
      Your matchday essentials are now active.
    </p>

    <p>
      You’ll receive arrival guidance, entry rules, and kick‑off reminders
      directly on WhatsApp.
    </p>

    <p class="subtle">
      Redirecting you to WhatsApp…
    </p>
  </div>

  <script>
    /* ===============================
       Pilot 4 – Canonical unlock logic
       Uses stadiums.json as source of truth
       =============================== */

    const WHATSAPP_NUMBER = "15558273850";
    const params = new URLSearchParams(window.location.search);
    const stadiumId = params.get("stadium");

    fetch("/data/stadiums.json")
      .then(response => response.json())
      .then(stadiums => {
        const stadium = stadiums.find(s => s.id === stadiumId);

        const stadiumName = stadium
          ? stadium.name
          : "your stadium";

        // Update copy
        document.getElementById("stadium-copy").innerHTML =
          `Your matchday essentials for <strong>${stadiumName}</strong> are now active.`;

        // Build WhatsApp message
        const MESSAGE =
          `Hi – I’m here for matchday updates for ${stadiumName}.`;

        const WHATSAPP_URL =
          "https://api.whatsapp.com/send" +
          "?phone=" + WHATSAPP_NUMBER +
          "&text=" + encodeURIComponent(MESSAGE);

        // Delay ensures copy is rendered before redirect
        setTimeout(() => {
          window.location.href = WHATSAPP_URL;
        }, 500);
      })
      .catch(() => {
        // Graceful fallback if stadiums.json fails
        const MESSAGE = "Hi – I’m here for matchday updates.";
        const WHATSAPP_URL =
          "https://api.whatsapp.com/send" +
          "?phone=" + WHATSAPP_NUMBER +
          "&text=" + encodeURIComponent(MESSAGE);

        setTimeout(() => {
          window.location.href = WHATSAPP_URL;
        }, 500);
      });
  </script>
</body>
</html>
