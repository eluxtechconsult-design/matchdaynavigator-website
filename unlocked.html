<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>You’re Unlocked – Matchday Essentials</title>

  <!-- Global site styles -->
  <link rel="stylesheet" href="/assets/style.css" />

  <style>
    .unlocked-container {
      max-width: 640px;
      margin: 80px auto;
      padding: 0 16px;
      text-align: center;
    }

    .unlocked-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.9rem;
      margin-bottom: 8px;
    }

    p {
      margin: 6px 0;
      line-height: 1.5;
      font-size: 1rem;
    }

    .primary-cta {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 22px;
      background: #16a34a;
      color: #ffffff;
      font-weight: 800;
      font-size: 1rem;
      border-radius: 8px;
      text-decoration: none;
    }

    .primary-cta:hover {
      opacity: 0.9;
    }

    .subtle {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>

<body>

  <div class="unlocked-container">

    <div class="unlocked-icon">🎉</div>

    <h1>You’re Unlocked</h1>

    <p>
      Your matchday essentials for this stadium are now active.
    </p>

    <p>
      You’ll receive arrival guidance, entry rules, and kick‑off
      reminders directly on WhatsApp.
    </p>

    <a
      id="whatsapp-link"
      class="primary-cta"
      target="_blank"
      rel="noopener"
    >
      Continue on WhatsApp →
    </a>

    <p class="subtle">
      You can stop messages at any time by replying STOP.
    </p>

  </div>

  <script>
    // Read stadium from query string: ?stadium=lumen-field
    const params = new URLSearchParams(window.location.search);
    const stadiumId = params.get("stadium") || "";

    const stadiumName = stadiumId
      ? stadiumId
          .replace(/-/g, " ")
          .replace(/\b\w/g, char => char.toUpperCase())
      : "your stadium";

    const whatsappMessage =
`Welcome to Matchday Navigator 👋

You’re all set for matchday at ${stadiumName}.

You’ll receive:
• Arrival guidance
• Entry rules & bag policies
• Kick‑off reminders

Messages are only sent around matchdays.
Reply STOP anytime to opt out.`;

    const phoneNumber = "15550000000"; // replace with real WhatsApp number

    document.getElementById("whatsapp-link").href =
      "https://wa.me/" +
      phoneNumber +
      "?text=" +
      encodeURIComponent(whatsappMessage);
  </script>

</body>
</html>
``
