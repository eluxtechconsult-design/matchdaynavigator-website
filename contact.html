<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Contact – MatchDay Navigator</title>

  <link rel="stylesheet" href="/assets/style.css"/>

  <style>
    body { background:#f8fafc; }

    .form-container {
      max-width: 980px;
      margin: 90px auto;
      background: #ffffff;
      border-radius: 26px;
      padding: 64px;
      box-shadow: 0 16px 44px rgba(0,0,0,0.1);
    }

    h1 { margin-top: 0; }

    form {
      display: grid;
      gap: 32px;
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
    }

    input, select, textarea {
      width: 100%;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-size: 1rem;
    }

    textarea { min-height: 220px; }

    button {
      padding: 18px 46px;
      border-radius: 16px;
      border: none;
      background: #16a34a;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="form-container">
  <h1>Start a coordination conversation</h1>

  <form method="POST" action="/api/contact">
    <div>
      <label>Organisation type</label>
      <select name="role">
        <option>City / Authority</option>
        <option>Stadium / Venue</option>
        <option>Hotel / Hospitality</option>
        <option>Other</option>
      </select>
    </div>

    <div>
      <label>Work email address</label>
      <input type="email" name="email" required/>
    </div>

    <div>
      <label>Briefly describe your role and event context</label>
      <textarea name="message" required></textarea>
    </div>

    <button type="submit">
      Submit coordination request →
    </button>
  </form>
</div>

</body>
</html>
