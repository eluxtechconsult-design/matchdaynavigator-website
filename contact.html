<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Contact – MatchDay Navigator</title>

  <link rel="stylesheet" href="/assets/style.css" />

  <style>
    body { background: #f8fafc; }

    .form-container {
      max-width: 980px;
      margin: 90px auto;
      background: #ffffff;
      border-radius: 26px;
      padding: 64px;
      box-shadow: 0 16px 44px rgba(0,0,0,0.1);
    }

    h1 {
      margin-top: 0;
    }

    .intro {
      max-width: 820px;
      margin-bottom: 48px;
      font-size: 1.1rem;
      color: #334155;
      line-height: 1.7;
    }

    form {
      display: grid;
      grid-template-columns: 1fr;
      gap: 34px;
    }

    label {
      font-weight: 600;
      margin-bottom: 8px;
      display: block;
    }

    select,
    textarea {
      width: 100%;
      padding: 18px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      font-size: 1rem;
    }

    textarea {
      min-height: 240px;
      resize: vertical;
    }

    button {
      align-self: flex-start;
      padding: 18px 46px;
      border-radius: 16px;
      border: none;
      background: #16a34a;
      color: white;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
    }

    button:hover {
      background: #15803d;
    }

    .back {
      margin-top: 64px;
      text-align: center;
    }

    .back a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
  </style>
</head>

<body>

<div class="form-container">
  <h1>Start a coordination conversation</h1>

  <p class="intro">
    Use the form below to initiate a structured coordination conversation with
    the MatchDay Navigator team. We respond with clear next steps relevant to your
    role, location, and event timeline.
  </p>

  <form action="https://formsubmit.co/admin@matchdaynavigator.com" method="POST">
    <input type="hidden" name="_subject" value="MatchDay Navigator – New Coordination Request" />
    <input type="hidden" name="_next" value="https://www.matchdaynavigator.com/thank-you.html" />
    <input type="hidden" name="_captcha" value="false" />

    <div>
      <label for="role">Organisation type</label>
      <select name="Role" id="role">
        <option>City / Authority</option>
        <option>Stadium / Venue</option>
        <option>Hotel / Hospitality</option>
        <option>Other</option>
      </select>
    </div>

    <div>
      <label for="message">Briefly describe your role and event context</label>
      <textarea
        id="message"
        name="Message"
        placeholder="Example: Stadium operations team coordinating gate access and bag policy for three group‑stage matches at [stadium name]."
      ></textarea>
    </div>

    <button type="submit">
      Submit coordination request →
    </button>
  </form>

  <div class="back">
    <a href="/cities/">
      ← Back to Cities & Venues
    </a>
  </div>
</div>

</body>
</html>
