<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Contact – MatchDay Navigator</title>
  <link rel="stylesheet" href="/assets/style.css"/>
</head>

<body>

<section class="mission">
  <h1>Contact MatchDay Navigator</h1>

  <p>
    Use this form to start a coordination conversation.
    We respond with next steps relevant to your role.
  </p>

  <form action="https://formsubmit.co/admin@matchdaynavigator.com" method="POST">
    <input type="hidden" name="_subject" value="MatchDay Navigator – New Inquiry"/>

    <label>Organisation type</label>
    <select name="Role">
      <option>City / Authority</option>
      <option>Stadium / Venue</option>
      <option>Hotel / Hospitality</option>
      <option>Other</option>
    </select>

    <label>Your message</label>
    <textarea name="Message" placeholder="Briefly describe your role and event involvement" required></textarea>

    <button type="submit" class="cta-button">
      Submit inquiry →
    </button>
  </form>

</section>

</body>
</html>
