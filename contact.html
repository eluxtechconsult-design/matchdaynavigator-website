<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Contact – MatchDay Navigator</title>

  <link rel="stylesheet" href="/assets/style.css"/>

  <style>
    body { background:#f8fafc; }

    .form-container {
      max-width: 980px;
      margin: 90px auto;
      background: #ffffff;
      border-radius: 26px;
      padding: 64px;
      box-shadow: 0 16px 44px rgba(0,0,0,0.1);
    }

    h1 { margin-top: 0; }

    form { display: grid; gap: 32px; }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
    }

    input, select, textarea {
      width: 100%;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-size: 1rem;
    }

    textarea { min-height: 220px; }

    button {
      padding: 18px 46px;
      border-radius: 16px;
      background: #16a34a;
      color: white;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    button:hover { background: #15803d; }

    .back {
      margin-top: 48px;
      text-align: center;
    }

    .back a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

<body>

<div class="form-container">
  <h1>Start a coordination conversation</h1>

  <!-- ✅ CRITICAL PART: POST DIRECTLY TO BACKEND SERVICE -->
  <form method="POST" action="https://mdn-bird-backend.onrender.com/api/contact">

    <div>
      <label for="role">Organisation type</label>
      <select name="role" id="role" required>
        <option value="">Select one</option>
        <option>City / Authority</option>
        <option>Stadium / Venue</option>
        <option>Hotel / Hospitality</option>
        <option>Other</option>
      </select>
    </div>

    <div>
      <label for="email">Work email address</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="name@organisation.com"
        required
      />
    </div>

    <div>
      <label for="message">Briefly describe your role and event context</label>
      <textarea
        id="message"
        name="message"
        placeholder="Example: City transport authority coordinating arrivals for three World Cup matches at Lumen Field."
        required
      ></textarea>
    </div>

    <button type="submit">
      Submit coordination request →
    </button>

  </form>

  <div class="back">
    <a href="/cities/">← Back to Cities & Venues</a>
  </div>
</div>

</body>
</html>
