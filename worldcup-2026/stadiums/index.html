<!DOCTYPE html><!DOCTYPE html">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Stadium – World Cup 2026</title>

  <link rel="stylesheet" href="/assets/style.css">
  <style>
    .stadium-container {
      max-width: 760px;
      margin: 40px auto;
      padding: 0 16px;
    }

    .stadium-meta {
      color: #475569;
      margin-bottom: 20px;
    }

    .stadium-section {
      margin-top: 32px;
    }

    .whatsapp-cta {
      margin-top: 24px;
      padding: 16px;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 12px;
    }

    .whatsapp-cta a {
      display: inline-block;
      margin-top: 12px;
      color: #16a34a;
      font-weight: 800;
      text-decoration: none;
    }

    .whatsapp-cta a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

<div class="stadium-container">

  <h1 id="stadium-name">Stadium</h1>
  <p id="stadium-city" class="stadium-meta"></p>

  <div class="stadium-section">
    <h2>Stadium information</h2>
    <p id="stadium-description"></p>
  </div>

  <div class="stadium-section">
    <h2>Capacity</h2>
    <p id="stadium-capacity"></p>
  </div>

  <div class="stadium-section whatsapp-cta">
    <h2>Matchday assistance</h2>
    <p id="whatsapp-text"></p>
    <a id="whatsapp-link" target="_blank">
      Continue on WhatsApp →
    </a>
  </div>

  <div class="stadium-section">
    <a href="/worldcup-2026/">← Back to Match Map</a>
  </div>

</div>

<script>
(async function () {
  const id = new URLSearchParams(window.location.search).get("id");
  if (!id) return;

  const [stadiums, cities] = await Promise.all([
    fetch("/data/stadiums.json").then(r => r.json()),
    fetch("/data/cities.json").then(r => r.json())
  ]);

  const stadium = stadiums.find(s => s.id === id);
  if (!stadium) return;

  const city = cities.find(c => c.id === stadium.cityId);

  document.getElementById("stadium-name").textContent = stadium.name;
  document.getElementById("stadium-city").textContent =
    `${city.name} · World Cup 2026`;

  document.getElementById("stadium-description").textContent =
    stadium.description;

  document.getElementById("stadium-capacity").textContent =
    stadium.capacity;

  document.getElementById("whatsapp-text").textContent =
    stadium.whatsappIntent;

  document.getElementById("whatsapp-link").href =
    `https://wa.me/15550000000?text=${encodeURIComponent(stadium.whatsappIntent)}`;
})();
</script>

</body>
</html>
