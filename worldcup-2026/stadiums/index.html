<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>World Cup 2026 Stadiums – MatchDay Navigator</title>

  <meta name="description"
        content="Browse FIFA World Cup 2026 stadiums and view official, event‑specific matchday guidance." />

  <link rel="stylesheet" href="/assets/style.css" />

  <style>
    body {
      margin: 0;
      background: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #0f172a;
    }

    header {
      background: linear-gradient(180deg, #0f172a, #1e293b);
      color: #ffffff;
      padding: 48px 20px 60px;
      text-align: center;
    }

    header img {
      width: 150px;
      margin-bottom: 18px;
    }

    header p {
      max-width: 820px;
      margin: 0 auto;
      color: #cbd5f5;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .content {
      max-width: 1200px;
      margin: 70px auto;
      padding: 0 24px;
    }

    .stadium-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 28px;
    }

    .stadium-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 10px 26px rgba(0,0,0,.08);
    }

    .stadium-card h3 {
      margin: 0 0 6px;
      font-size: 1.25rem;
    }

    .stadium-card p {
      margin: 0 0 16px;
      color: #475569;
    }

    .stadium-card a {
      color: #2563eb;
      font-weight: 600;
      text-decoration: none;
    }

    .stadium-card a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 40px;
      font-size: 0.9rem;
      color: #475569;
    }

    footer a {
      color: #2563eb;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <img src="/assets/logo.png" alt="MatchDay Navigator" />
  <h1>World Cup 2026 Stadiums</h1>
  <p>Select a stadium to view official, event‑specific matchday guidance.</p>
</header>

<!-- LIST VIEW -->
<section id="stadium-list" class="content"></section>

<!-- DETAIL VIEW -->
<section id="stadium-detail" class="content" style="display:none;"></section>

<footer>
  <a href="/worldcup-2026/cities">← Browse host cities</a>
</footer>

<script>
(async function () {
  const params = new URLSearchParams(window.location.search);
  const stadiumId = params.get("id");

  const listView = document.getElementById("stadium-list");
  const detailView = document.getElementById("stadium-detail");

  const cities = await fetch("/data/cities.json").then(r => r.json());
  const stadiums = await fetch("/data/stadiums.json").then(r => r.json());

  const cityById = Object.fromEntries(cities.map(c => [c.id, c]));

  /* =========================
     DETAIL MODE
     ========================= */
  if (stadiumId) {
    const stadium = stadiums.find(s => s.id === stadiumId);

    if (!stadium) {
      detailView.innerHTML = "<p>Stadium not found.</p>";
      detailView.style.display = "block";
      return;
    }

    const city = cityById[stadium.cityId];

    detailView.innerHTML = `
      <h2>${stadium.name}</h2>

      <p><strong>Host city:</strong> ${city?.name || "—"}</p>
      <p><strong>Capacity:</strong> ${stadium.capacity?.toLocaleString() || "—"}</p>
      <p><strong>Bag policy:</strong> ${stadium.bagPolicy || "See official guidance"}</p>

      <p>
        <a href="${stadium.officialUrl}" target="_  <a href="/worldcup-iums/← Back to stadium list</a>
      </p>
    `;

    detailView.style.display = "block";
    return;
  }

  /* =========================
     LIST MODE
     ========================= */
  let html = '<div class="stadium-grid">';

  stadiums.forEach(stadium => {
    const city = cityById[stadium.cityId];

    html += `
      <div class="stadium-card">
        <h3>${stadium.name}</h3>
        <p>${city?.name || ""}</p>
        <a href="/worldcup-2026/stadiums/?id=${stadium.id   View stadium →
        </a>
      </div>
    `;
  });

  html += '</div>';
  listView.innerHTML = html;
})();
</script>

</body>
</html>
