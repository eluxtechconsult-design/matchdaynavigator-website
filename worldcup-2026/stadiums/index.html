<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Stadium – World Cup 2026</title>

  <!-- Global site styles -->
  <link rel="stylesheet" href="/assets/style.css" />

  <style>
    .stadium-container {
      max-width: 720px;
      margin: 16px auto;
      padding: 0 16px;
    }

    /* Headings */
    h1 {
      font-size: 1.7rem;
      margin-bottom: 2px;
    }

    h2 {
      font-size: 1rem;
      margin: 10px 0 4px;
    }

    p {
      line-height: 1.4;
      margin: 0;
    }

    ul {
      margin: 0;
      padding-left: 16px;
    }

    .stadium-meta {
      font-size: 0.85rem;
      color: #475569;
      margin-bottom: 10px;
    }

    .stadium-section {
      margin-top: 10px;
    }

    .subtle {
      color: #64748b;
      font-size: 0.85rem;
    }

    /* WhatsApp CTA – compact but clear */
    .whatsapp-cta {
      margin: 12px auto 8px;
      padding: 12px;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 10px;
      text-align: center;
    }

    .whatsapp-cta a {
      display: inline-block;
      margin-top: 6px;
      font-weight: 800;
      color: #16a34a;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .whatsapp-cta a:hover {
      text-decoration: underline;
    }

    .back-link {
      display: block;
      margin-top: 10px;
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="stadium-container">

  <h1 id="stadium-name"></h1>
  <p id="stadium-city" class="stadium-meta"></p>

  <div class="stadium-section">
    <h2 id="t-stadium-info"></h2>
    <p id="stadium-description"></p>
  </div>

  <div class="stadium-section">
    <h2 id="t-capacity"></h2>
    <p id="stadium-capacity"></p>
  </div>

  <div class="stadium-section">
    <h2 id="t-matches"></h2>
    <ul id="match-list" class="subtle"></ul>
  </div>

  <div class="stadium-section">
    <h2 id="t-arrival"></h2>
    <p id="arrival-text" class="subtle"></p>
  </div>

  <div class="stadium-section">
    <h2 id="t-bags"></h2>
    <p id="bags-text" class="subtle"></p>
  </div>

  <div class="stadium-section whatsapp-cta">
    <h2 id="t-matchday"></h2>
    <p>
      <span id="whatsapp-intro"></span><br />
      <a id="whatsapp-link" target="_blank"></a>
    </p>
  </div>

  <a href="/worldcup-2026/" class="back-link">
    ← Back to Match Map
  </a>

</div>

<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  const lang = params.get("lang") || "en";
  if (!id) return;

  const [stadiums, cities, strings] = await Promise.all([
    fetch("/data/stadiums.json").then(r => r.json()),
    fetch("/data/cities.json").then(r => r.json()),
    fetch(`/locales/${lang}.json`).then(r => r.json())
  ]);

  const stadium = stadiums.find(s => s.id === id);
  const city = cities.find(c => c.id === stadium.cityId);

  document.getElementById("stadium-name").textContent = stadium.name;
  document.getElementById("stadium-city").textContent =
    `${city.name} · World Cup 2026`;

  document.getElementById("stadium-description").textContent =
    stadium.description[lang] || stadium.description.en;

  document.getElementById("stadium-capacity").textContent =
    stadium.capacity;

  document.getElementById("t-stadium-info").textContent = strings.stadium_info;
  document.getElementById("t-capacity").textContent = strings.capacity;
  document.getElementById("t-matches").textContent = strings.matches_title;
  document.getElementById("t-arrival").textContent = strings.arrival_title;
  document.getElementById("t-bags").textContent = strings.bags_title;
  document.getElementById("t-matchday").textContent = strings.matchday_assistance;

  document.getElementById("arrival-text").textContent = strings.arrival_text;
  document.getElementById("bags-text").textContent = strings.bags_text;
  document.getElementById("whatsapp-intro").textContent =
    strings.whatsapp_cta_intro;

  document.getElementById("whatsapp-link").textContent =
    strings.whatsapp_cta_line;

  const matchList = document.getElementById("match-list");
  if (!stadium.matches || stadium.matches.length === 0) {
    matchList.innerHTML = `<li>${strings.matches_placeholder}</li>`;
  }

  const whatsappMessage =
    `Welcome to Matchday Navigator 👋

You’ll get matchday updates for ${stadium.name}, including arrival guidance, entry rules and kick‑off reminders.

Messages are only sent around matchdays.
Reply STOP anytime to opt out.`;

  document.getElementById("whatsapp-link").href =
    `https://wa.me/15550000000?text=${encodeURIComponent(whatsappMessage)}`;
})();
</script>

</body>
</html>
