<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stadium</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>

<body>

<h1 id="stadium-name">Stadium</h1>
<p id="stadium-city"></p>

<script>
(async function () {
  const id = new URLSearchParams(location.search).get("id");
  const stadiums = await fetch("../../data/stadiums.json").then(r=>r.json());
  const cities = await fetch("../../data/cities.json").then(r=>r.json());

  const stadium = stadiums.find(s => s.id === id);
  const city = cities.find(c => c.id === stadium.cityId);

  document.getElementById("stadium-name").textContent = stadium.name;
  document.getElementById("stadium-city").textContent =
    city.name + " · World Cup 2026";
})();
</script>

</body>
</html>
