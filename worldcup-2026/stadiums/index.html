<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>World Cup 2026 Stadiums – MatchDay Navigator</title>
  <meta name="description"
        content="Browse FIFA World Cup 2026 stadiums and view official, event‑specific matchday guidance." />

  <link rel="stylesheet" href="/assets/style.css" />
</head>

<body>

<header style="background:linear-gradient(180deg,#0f172a,#1e293b);padding:56px 20px;text-align:center;color:#fff;">
  <img src="/assets/logo.png" style="width:160px;margin-bottom:20px" />
  <h1>World Cup 2026 Stadiums</h1>
  <p style="color:#cbd5f5;max-width:820px;margin:0 auto">
    Select a stadium to view official, event‑specific matchday guidance.
  </p>
</header>

<section id="stadium-list" style="max-width:1200px;margin:70px auto;padding:0 24px;"></section>
<section id="stadium-detail" style="max-width:900px;margin:70px auto;padding:0 24px;display:none;"></section>

<footer style="text-align:center;padding:48px">
  <a href="/worldcup-2026/cities">← Browse host cities</a>
</footer>

<script>
(async function () {

  const listView   = document.getElementById("stadium-list");
  const detailView = document.getElementById("stadium-detail");
  const params = new URLSearchParams(window.location.search);
  const stadiumId = params.get("id");

  let cities, stadiums;

  try {
    cities   = await fetch("/data/cities.json").then(r => r.json());
    stadiums = await fetch("/data/stadiums.json").then(r => r.json());
  } catch (e) {
    console.error("FAILED TO LOAD DATA:", e);
    listView.innerHTML = `
      <p style="color:#b91c1c;font-weight:700">
        Stadium data could not be loaded.<br/>
        Please verify that <code>/data/stadiums.json</code> is accessible.
      </p>
    `;
    return;
  }

  if (!Array.isArray(stadiums) || stadiums.length === 0) {
    listView.innerHTML = `
      <p style="color:#b91c1c;font-weight:700">
        Stadium list is empty.<br/>
        Data file loaded, but contains no stadiums.
      </p>
    `;
    return;
  }

  const cityById = Object.fromEntries(cities.map(c => [c.id, c]));

  /* ========= DETAIL MODE ========= */
  if (stadiumId) {
    const stadium = stadiums.find(s => s.id === stadiumId);

    if (!stadium) {
      detailView.innerHTML = "<p>Stadium not found.</p>";
      detailView.style.display = "block";
      listView.style.display = "none";
      return;
    }

    const city = cityById[stadium.cityId];

    detailView.innerHTML = `
      <h2>${stadium.name}</h2>
      <p><strong>Host city:</strong> ${city?.name || ""}</p>
      <p><strong>Capacity:</strong> ${stadium.capacity || "—"}</p>
      <p><strong>Bag policy:</strong> ${stadium.bagPolicy || "See official guidance"}</p>
      <p>
        <a href="${stadium.officialUrl}" target="_blank-2026/← Back to stadium list</a>
      </p>
    `;

    detailView.style.display = "block";
    listView.style.display = "none";
    return;
  }

  /* ========= LIST MODE ========= */
  let html = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px;">';

  stadiums.forEach(s => {
    const city = cityById[s.cityId];
    html += `
      <div style="background:#fff;border-radius:18px;padding:26px;box-shadow:0 10px 26px rgba(0,0,0,.08)">
        <h3>${s.name}</h3>
        <p>${city?.name || ""}</p>
        <a href="/worldcup-2026/stadiums/?id=${s      View stadium →
        </a>
      </div>
    `;
  });

  html += '</div>';
  listView.innerHTML = html;

})();
</script>

</body>
</html>
