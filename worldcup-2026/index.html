<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>World Cup 2026 Match Map – MatchDay Navigator</title>

  <meta
    name="description"
    content="Interactive match map for FIFA World Cup 2026 host cities across the United States, Canada, and Mexico."
  >

  <!-- Global styles -->
  <link rel="stylesheet" href="/assets/style.css">

  <!-- World Cup map styles -->
  <link rel="stylesheet" href="/worldcup-2026/assets/wc-map.css">

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- ✅ Critical: map must have height -->
  <style>
    .wc-map-layout {
      display: grid;
      grid-template-columns: 78% 22%;
      min-height: calc(100vh - 120px);
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 600px;
    }

    .football-marker {
      font-size: 20px;
      line-height: 20px;
    }

    #host-city-list {
      list-style: none;
      padding-left: 0;
      margin-top: 12px;
    }

    #host-city-list li {
      cursor: pointer;
      padding: 6px 0;
    }

    #host-city-list li:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

<header class="wc-map-header">
  <h1>World Cup 2026 Match Map</h1>

  <div class="subtitle">
    Official host cities across the United States, Canada, and Mexico.
  </div>

  <div class="wc-map-nav">
    <a href="/">← Back to Home</a>
    <button type="button" class="reset-map">Reset map view →</button>
  </div>
</header>

<div class="wc-map-layout">

  <!-- MAP -->
  <div id="map"></div>

  <!-- RIGHT PANEL -->
  <aside class="wc-city-panel">
    <h2 class="panel-title">Select a host city</h2>
    <div class="panel-subtitle">
      Click a city name or ⚽ icon to view location.
    </div>
    <ul id="host-city-list"></ul>
  </aside>

</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- ✅ INLINE, DATA-DRIVEN MAP LOGIC -->
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const listEl = document.getElementById("host-city-list");
  const resetBtn = document.querySelector(".reset-map");

  function fail(message) {
    console.error(message);
    listEl.innerHTML =
      "<li style='color:#ffb3b3'>Failed to load host cities</li>";
  }

  let cities;

  try {
    const res = await fetch("/worldcup-2026/data/cities.json");
    if (!res.ok) throw new Error("cities.json not found");
    cities = await res.json();
  } catch (err) {
    return fail(err);
  }

  const map = L.map("map", {
    scrollWheelZoom: false,
    zoomControl: true
  });

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap contributors"
  }).addTo(map);

  const footballIcon = L.divIcon({
    className: "football-marker",
    html: "⚽",
    iconSize: [20, 20],
    iconAnchor: [10, 10]
  });

  const bounds = [];

  cities.forEach(city => {
    // Marker
    L.marker([city.lat, city.lng], { icon: footballIcon })
      .addTo(map)
      .on("click", () => focusCity(city));

    bounds.push([city.lat, city.lng]);

    // Sidebar list
    const li = document.createElement("li");
    li.textContent = city.name;
    li.onclick = () => focusCity(city);
    listEl.appendChild(li);
  });

  map.fitBounds(bounds, { padding: [80, 80], maxZoom: 4 });

  resetBtn.onclick = () => {
    map.fitBounds(bounds, { padding: [80, 80], maxZoom: 4 });
  };

  function focusCity(city) {
    map.setView([city.lat, city.lng], 6);
  }
});
</script>

</body>
</html>
