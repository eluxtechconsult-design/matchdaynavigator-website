<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>World Cup 2026 Match Map – MatchDay Navigator</title>

  <meta
    name="description"
    content="Interactive match map for FIFA World Cup 2026 host cities across the United States, Canada, and Mexico."
  />

  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/worldcup-2026/assets/wc-map.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body>

<header class="wc-map-header">
  <h1>World Cup 2026 Match Map</h1>
  <div class="subtitle">
    Official host cities across the United States, Canada, and Mexico.
  </div>
  <div class="wc-map-nav">
    <a href="/">← Back to Home</a>
    <button type="button" class="reset-map">Reset map view →</button>
  </div>
</header>

<div class="wc-map-layout">
  <div id="map"></div>

  <aside class="wc-city-panel">
    <h2 class="panel-title">Select a host city</h2>
    <div class="panel-subtitle">
      Click a city name or ⚽ map icon.
    </div>
    <ul id="host-city-list"></ul>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
(async function () {

  // Load data
  const cities = await fetch("/worldcup-2026/data/cities.json").then(r => r.json());
  const stadiums = await fetch("/worldcup-2026/data/stadiums.json").then(r => r.json());

  // Init map
  const map = L.map("map", { scrollWheelZoom: false });
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap contributors"
  }).addTo(map);

  const bounds = [];
  const cityList = document.getElementById("host-city-list");
  const resetBtn = document.querySelector(".reset-map");

  const footballIcon = L.divIcon({
    className: "football-marker",
    html: "⚽",
    iconSize: [20, 20],
    iconAnchor: [10, 10]
  });

  cities.forEach(city => {
    // Marker
    const marker = L.marker([city.lat, city.lng], { icon: footballIcon })
      .addTo(map)
      .on("click", () => focusCity(city));

    bounds.push([city.lat, city.lng]);

    // Sidebar list
    const li = document.createElement("li");
    li.textContent = city.name;
    li.onclick = () => focusCity(city);
    cityList.appendChild(li);
  });

  map.fitBounds(bounds, { padding: [80, 80], maxZoom: 4 });

  resetBtn.onclick = () => {
    map.fitBounds(bounds, { padding: [80, 80], maxZoom: 4 });
  };

  function focusCity(city) {
    map.setView([city.lat, city.lng], 6);
  }

})();
</script>

</body>
</html>
