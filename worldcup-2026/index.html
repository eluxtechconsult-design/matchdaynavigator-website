<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>World Cup 2026 Match Map – MatchDay Navigator</title>

  <meta
    name="description"
    content="Interactive match map for FIFA World Cup 2026 host cities across the United States, Canada, and Mexico."
  />

  <!-- Global styles -->
  <link rel="stylesheet" href="/assets/style.css" />

  <!-- WC map styles -->
  <link rel="stylesheet" href="/worldcup-2026/assets/wc-map.css" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
</head>

<body>

<header class="wc-map-header">
  <h1>World Cup 2026 Match Map</h1>

  <div class="subtitle">
    Official host cities across the United States, Canada, and Mexico.
  </div>

  <div class="wc-map-nav">
    <a href="/">← Back to Home</a>
    <button type="button" class="reset-map">Reset map view →</button>
  </div>
</header>

<div class="wc-map-layout">

  <!-- MAP -->
  <div id="map"></div>

  <!-- RIGHT PANEL -->
  <aside class="wc-city-panel">
    <h2 class="panel-title">Select a host city</h2>
    <div class="panel-subtitle">
      Click a city name or map icon to view stadium details.
    </div>
    <ul id="host-city-list"></ul>
  </aside>

</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- ✅ INLINE MAP LOGIC (DATA‑DRIVEN) -->
<script>
(async function () {

  try {
    /* =============================
       LOAD DATA (CORRECT PATHS)
       ============================= */
    const cities = await fetch("/worldcup-2026/data/cities.json").then(r => r.json());
    const stadiums = await fetch("/worldcup-2026/data/stadiums.json").then(r => r.json());

    /* =============================
       INIT MAP
       ============================= */
    const map = L.map("map", {
      scrollWheelZoom: false,
      zoomControl: true
    });

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap contributors"
    }).addTo(map);

    /* =============================
       ICON (FOOTBALL)
       ============================= */
    const footballIcon = L.divIcon({
      className: "football-marker",
      html: "⚽",
      iconSize: [20, 20],
      iconAnchor: [10, 10]
    });

    /* =============================
       UI REFERENCES
       ============================= */
    const listEl = document.getElementById("host-city-list");
    const resetBtn = document.querySelector(".reset-map");
    const bounds = [];

    /* =============================
       INDEX STADIUMS BY CITY
       ============================= */
    const stadiumsByCity = {};
    stadiums.forEach(s => {
      stadiumsByCity[s.cityId] ??= [];
      stadiumsByCity[s.cityId].push(s);
    });

    /* =============================
       RENDER LIST + MARKERS
       ============================= */
    cities.forEach(city => {

      // Map marker
      const marker = L.marker([city.lat, city.lng], {
        icon: footballIcon
      }).addTo(map);

      marker.on("click", () => focusCity(city));

      // Bounds
      bounds.push([city.lat, city.lng]);

      // Sidebar list
      const li = document.createElement("li");
      li.textContent = city.name;
      li.style.cursor = "pointer";
      li.onclick = () => focusCity(city);
      listEl.appendChild(li);
    });

    /* =============================
       FIT MAP INIT
       ============================= */
    map.fitBounds(bounds, { padding: [90, 90], maxZoom: 4 });

    /* =============================
       RESET MAP
       ============================= */
    resetBtn.onclick = () => {
      map.fitBounds(bounds, { padding: [90, 90], maxZoom: 4 });
    };

    /* =============================
       FOCUS CITY
       ============================= */
    function focusCity(city) {
      map.setView([city.lat, city.lng], 6);
    }

  } catch (err) {
    console.error("World Cup map failed to initialise:", err);
  }

})();
</script>

</body>
</html>
