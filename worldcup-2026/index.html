<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- ✅ CRITICAL: define base path explicitly -->
  <base href="/worldcup-2026/" />

  <title>World Cup 2026 Match Map – MatchDay Navigator</title>

  <meta
    name="description"
    content="Interactive match map for FIFA World Cup 2026 host cities across the United States, Canada, and Mexico."
  />

  <!-- Global styles (absolute) -->
  <link rel="stylesheet" href="/assets/style.css" />

  <!-- Map layout styles (now relative to base) -->
  <link rel="stylesheet" href="assets/wc-map.css" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
</head>

<body>

<header class="wc-map-header">
  <h1>World Cup 2026 Match Map</h1>

  <div class="subtitle">
    Official host cities across the United States, Canada, and Mexico.
  </div>

  <div class="wc-map-nav">
    <a href="/">← Back to Home</a>
    <button type="button" class="reset-map">Reset map view →</button>
  </div>
</header>

<div class="wc-map-layout">

  <!-- MAP -->
  <div id="map"></div>

  <!-- SIDEBAR -->
  <aside class="wc-city-panel">
    <h2 class="panel-title">Select a host city</h2>
    <div class="panel-subtitle">
      Click a city name or ⚽ icon to view location.
    </div>
    <ul id="host-city-list"></ul>
  </aside>

</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- ✅ FINAL, STABLE MAP LOGIC -->
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const listEl = document.getElementById("host-city-list");
  const resetBtn = document.querySelector(".reset-map");

  let hostCities;

  try {
    // ✅ Now resolves to /worldcup-2026/data/host-cities.json
    const res = await fetch("data/host-cities.json");
    if (!res.ok) throw new Error("host-cities.json not found");
    hostCities = await res.json();
  } catch (err) {
    console.error(err);
    listEl.innerHTML =
      "<li style='color:#fecaca'>Failed to load host cities</li>";
    return;
  }

  const map = L.map("map", {
    scrollWheelZoom: false,
    zoomControl: true
  });

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap contributors"
  }).addTo(map);

  const footballIcon = L.divIcon({
    className: "football-marker",
    html: "⚽",
    iconSize: [20, 20],
    iconAnchor: [10, 10]
  });

  const bounds = [];

  hostCities.forEach(city => {
    L.marker([city.lat, city.lng], { icon: footballIcon })
      .addTo(map)
      .on("click", () => focusCity(city));

    bounds.push([city.lat, city.lng]);

    const li = document.createElement("li");
    li.textContent = city.name;
    li.onclick = () => focusCity(city);
    listEl.appendChild(li);
  });

  map.fitBounds(bounds, { padding: [80, 80], maxZoom: 4 });

  resetBtn.onclick = () => {
    map.fitBounds(bounds, { padding: [80, 80], maxZoom: 4 });
  };

  function focusCity(city) {
    map.setView([city.lat, city.lng], 6);
  }
});
</script>

</body>
</html>
