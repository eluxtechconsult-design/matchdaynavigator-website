<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your World Cup 2026 Map – MatchDay Navigator</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>

<body>

<header class="hero">
  <div class="container">
    <h1>Your World Cup 2026 Push‑Pin Map</h1>
    <p>Turn your journey into a framed keepsake.</p>
  </div>
</header>

<section class="section">
  <div class="container">

    <h2>Select your map</h2>

    <label>
      Size:
      <select>
        <option>A2 (42 × 59 cm)</option>
        <option>A1 (59 × 84 cm)</option>
      </select>
    </label>

    <label>
      Frame:
      <select>
        <option>Black</option>
        <option>Oak</option>
        <option>Walnut</option>
      </select>
    </label>

    <p>
      🎨 City‑specific designs included automatically.
    </p>

    <h3>Get notified when ordering opens</h3>

    <form>
      <input type="email" placeholder="Email address" required />
      <button type="submit">Notify me</button>
    </form>

    <p class="note">
      💳 Checkout will open closer to the tournament with ticketing partners.
    </p>

  </div>
</section>

<footer class="footer">
  <div class="container footer-links">
    <a href="/">Back to site</a>
  </div>
</footer>

</body>
</html>
